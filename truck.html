<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truck Lab</title>
<meta name="description" content="A rough time-and-motion model for where tools live in a survey truck, and which bags are worth making.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>
:root{
  --bg:#f5f5f7;--bg-soft:#e8e8ed;--bg-panel:#fff;--border:#d1d1d6;--border-soft:#e4e4e9;
  --text:#1d1c18;--muted:#696660;--faint:#95928c;
  --blue:#1e4974;--blue-soft:#2e5d8b;--blue-deep:#143659;--blue-wash:#e7eef6;
  --red:#a82626;--red-wash:#f5e3e3;--green:#5c7f3f;--green-wash:#eef1e3;
  --amber:#b07419;--amber-wash:#fae9c4;--amber-ink:#7a5210;--orange:#c2521f;--orange-wash:#fbe7dc;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.04);
  --shadow-lg:0 8px 22px rgba(0,0,0,.10),0 3px 6px rgba(0,0,0,.05);
  --radius:8px;--radius-sm:5px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181c;--bg-soft:#22252b;--bg-panel:#1d2025;--border:#33373f;--border-soft:#2a2e35;
  --text:#e9e8e4;--muted:#9a978f;--faint:#6d6a64;
  --blue:#6ea3d8;--blue-soft:#8bb8e6;--blue-deep:#0f2740;--blue-wash:#1c2c3d;
  --red:#e08080;--red-wash:#3a2222;--green:#a3c47d;--green-wash:#26301c;
  --amber:#e0a94a;--amber-wash:#3a2e14;--amber-ink:#e8c37c;--orange:#e0895b;--orange-wash:#3a2318;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 8px 22px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#16181c;--bg-soft:#22252b;--bg-panel:#1d2025;--border:#33373f;--border-soft:#2a2e35;
  --text:#e9e8e4;--muted:#9a978f;--faint:#6d6a64;
  --blue:#6ea3d8;--blue-soft:#8bb8e6;--blue-deep:#0f2740;--blue-wash:#1c2c3d;
  --red:#e08080;--red-wash:#3a2222;--green:#a3c47d;--green-wash:#26301c;
  --amber:#e0a94a;--amber-wash:#3a2e14;--amber-ink:#e8c37c;--orange:#e0895b;--orange-wash:#3a2318;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 8px 22px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:9px;padding:9px 12px 9px 52px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.ver{font-size:10px;color:var(--faint);font-weight:500}
.spacer{flex:1}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-panel);font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--bg-soft)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-soft)}
.btn-danger{color:var(--red);border-color:var(--red);background:transparent}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-icon{padding:5px 8px;font-size:13px;line-height:1}

/* KPI strip */
#kpis{display:flex;gap:0;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.kpi{padding:8px 14px;border-right:1px solid var(--border-soft);min-width:112px;flex-shrink:0}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1.2}
.kpi .s{font-size:10.5px;color:var(--faint)}
.kpi .v.good{color:var(--green)}.kpi .v.warn{color:var(--amber)}.kpi .v.bad{color:var(--red)}

/* tabs */
#tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:8px 13px;font:inherit;font-size:12.5px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1280px;margin:0 auto}
.split{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}

.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.panel-head h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel-head .n{font-size:10px;color:var(--faint);font-weight:600}
.panel-body{padding:12px}
.panel-body.flush{padding:0}
.hint{font-size:11px;color:var(--faint);line-height:1.45}

/* truck plan */
svg.plan{width:100%;height:auto;display:block;background:var(--bg);border-radius:var(--radius)}
.zone-rect{cursor:pointer;transition:opacity .1s}
.zone-rect:hover{opacity:.85}
.zone-lbl{font-size:3.1px;font-weight:700;fill:var(--text);pointer-events:none;font-family:var(--font)}
.zone-sub{font-size:2.3px;fill:var(--muted);pointer-events:none;font-family:var(--mono)}
.truck-body{fill:none;stroke:var(--border);stroke-width:2}
.truck-note{font-size:2.6px;fill:var(--faint);font-family:var(--font)}
.divider .dline{stroke:var(--text);stroke-width:1;pointer-events:none}
.divider .dgrab{stroke:transparent;stroke-width:8;cursor:ns-resize}
.divider:hover .dline{stroke:var(--orange);stroke-width:1.6}
.divider .dlbl{font-size:2.5px;font-weight:700;fill:var(--orange);pointer-events:none;font-family:var(--mono)}

/* lists */
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg)}
.row.sel{background:var(--blue-wash)}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .meta{font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.row .pick{cursor:pointer}
.tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:1px 5px;background:var(--bg-soft);color:var(--muted);flex-shrink:0}
.tag.hot{background:var(--orange-wash);color:var(--orange)}
.tag.zone{background:var(--blue-wash);color:var(--blue)}
.tag.save{background:var(--green-wash);color:var(--green)}
.bar{height:5px;border-radius:3px;background:var(--bg-soft);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar>i.warn{background:var(--amber)}.bar>i.bad{background:var(--red)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
td input,td select{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;font:inherit;font-size:12px;background:transparent;color:var(--text)}
td input:hover,td select:hover{border-color:var(--border)}
td input:focus,td select:focus{outline:none;border-color:var(--blue-soft);background:var(--bg)}
td input.num{font-family:var(--mono);text-align:right;max-width:74px}
tr.dead td{opacity:.4}

.pillrow{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--bg-soft);color:var(--muted);font-weight:600}
.pill.on{background:var(--blue-wash);color:var(--blue)}

.kit{border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:9px;background:var(--bg-panel)}
.kit h4{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kit .why{font-size:11.5px;color:var(--muted);margin:4px 0 7px;line-height:1.45}

.cmp{display:flex;flex-direction:column;gap:9px}
.cmp-row{display:flex;align-items:center;gap:9px}
.cmp-row .lab{width:118px;font-size:11.5px;font-weight:600;flex-shrink:0}
.cmp-row .track{flex:1;height:22px;background:var(--bg-soft);border-radius:4px;overflow:hidden;position:relative}
.cmp-row .fill{height:100%;background:var(--blue);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.cmp-row .fill.best{background:var(--green)}

.sheet{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.sheet h2{font-size:17px;margin-bottom:2px}
.sheet .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.sheet-zone{border-top:1px solid var(--border);padding:9px 0}
.sheet-zone h4{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.sheet-zone .cap{font-size:10.5px;color:var(--muted);font-family:var(--mono);font-weight:500}
.sheet-zone ul{margin:5px 0 0 16px;font-size:12px;line-height:1.6}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--blue-deep);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);transition:transform .18s;z-index:100;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media print{header,#tabs,#kpis,.btn{display:none!important}body{overflow:visible}main{overflow:visible;padding:0}}

/* ── packing canvas ── */
.packwrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
svg.pack{width:100%;height:auto;max-height:82vh;display:block;touch-action:none}
.cont-rect{fill:var(--bg-panel);stroke:var(--border);stroke-width:.5}
.cont-rect.hot{stroke:var(--blue);stroke-width:1.1}
.cont-lbl{font-size:2.7px;font-weight:700;fill:var(--muted);font-family:var(--font);pointer-events:none}
.cont-dim{font-size:2.1px;fill:var(--faint);font-family:var(--mono);pointer-events:none}
.grp{font-size:3px;font-weight:700;fill:var(--faint);font-family:var(--font);pointer-events:none;
     text-transform:uppercase;letter-spacing:.1em}
.item{cursor:grab}
.item.drag{cursor:grabbing}
.item rect{stroke-width:.4;stroke:rgba(0,0,0,.35)}
.item text{font-size:2.4px;font-weight:700;fill:#10233a;font-family:var(--font);pointer-events:none}
.item.bad rect{stroke:var(--red);stroke-width:1}
.tray{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;margin-top:10px}
.tray h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.chipitem{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;
  border-radius:5px;border:1px solid var(--border);background:var(--bg);margin:0 4px 4px 0;cursor:grab}
.chipitem .d{font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style></head>
<body>

<header>
  <h1>Truck Lab <span class="ver">v0.2 · packing model</span></h1>
  <span class="spacer"></span>
  <button class="btn" onclick="autoPack()">⚙ Auto-pack</button>
  <button class="btn" onclick="emptyAll()">empty</button>
  <button class="btn" onclick="resetAll()">reset</button>
  <button class="btn btn-icon" onclick="toggleTheme()" title="light / dark">◐</button>
</header>

<div id="kpis"></div>

<div id="tabs">
  <button class="tab on" data-tab="pack" onclick="setTab('pack')">Packing</button>
  <button class="tab" data-tab="tools" onclick="setTab('tools')">Tools</button>
  <button class="tab" data-tab="zones" onclick="setTab('zones')">Compartments</button>
  <button class="tab" data-tab="sheet" onclick="setTab('sheet')">Layout sheet</button>
</div>

<main><div class="wrap" id="view"></div></main>
<div id="toast"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════
   Truck Lab v0.2 — a packing model for a survey truck.

   v0.1 was cubic feet in buckets, which cannot answer "will the laser
   case actually go in that bay". This one is geometric: every tool is a
   real box in inches, every compartment is a real box in inches, and
   things are dragged into place with collision, bounds and a height
   check. Rotation is a click.

   The time model rides on top of the geometry: reaching something costs
   the compartment's base seconds plus a penalty for how far up the bed
   it sits, because the tailgate end is the end you can reach. So where
   a thing sits inside a compartment matters, not just which one.

   Not modelled: stacking (one layer per compartment, height checked),
   anything soft that squishes, and the fact that a real crew will throw
   a rope on top of all of it anyway.
   ══════════════════════════════════════════════════════════════════ */
const DB_KEY='truckLabDB2';
const THEME_KEY='truckLabTheme';

/* 2021 Tacoma Access Cab, 6' bed, with a wooden box that spans the whole
   bed: 2x6 frame so 5.5" inside, three compartments across the width,
   one divider in the driver bay and one in the passenger bay making a
   cubby at the tailgate end of each. */
const TRUCK={name:'2021 Toyota Tacoma — Access Cab, 6\' bed',
  bedL:73.7, bedW:56.7, bedWells:41.5, bedD:19.1, payload:1175};
const BOX={L:73.7, bedW:56.7, depth:5.5, bays:3, minCub:6, maxCub:40,
           x0:10, yFront:112, yRear:185.7};
/* The box is narrower than the bed, which is what leaves the slim channel
   down each side between the box wall and the inner bed wall. Outer width
   and wall thickness are editable — measure yours. */
const BOXDEF={outerW:50, wall:1.5, sideH:12};

/* Reaching up the bed costs you: the tailgate end is the end you stand at. */
const REACH_PER_FT=1.3;
const LOOSE_REACH=55;

/* Containers. l runs front-to-back along the truck, w across it, h up.
   ax/ay are where the container is drawn on the canvas, in inches.
   The five box compartments get l and ay from the divider positions. */
const SEED_CONTS=[
  {id:'cubD', ab:'Drv cubby',  below:true, name:'Driver cubby',        reach:7,  h:5.5,  rear:0.99, fromRear:true},
  {id:'cubP', ab:'Pass cubby', below:true, name:'Passenger cubby',     reach:7,  h:5.5,  rear:0.99, fromRear:true},
  {id:'boxD', ab:'Driver bay', name:'Box — driver bay',    reach:8,  h:5.5,  rear:0.88, fromRear:true},
  {id:'boxP', ab:'Pass bay',   name:'Box — passenger bay', reach:8,  h:5.5,  rear:0.88, fromRear:true},
  {id:'boxC', ab:'Center bay', name:'Box — center bay',    reach:12, h:5.5,  rear:0.88, fromRear:true},
  {id:'sideD',ab:'Drv channel',name:'Side channel — driver',   reach:10, h:12, rear:0.88, fromRear:true, turn:true},
  {id:'sideP',ab:'Pass channel',name:'Side channel — passenger',reach:10, h:12, rear:0.88, fromRear:true, turn:true},
  {id:'boxtop',ab:'Box top',   name:'Box top (strapped)', reach:9,  w:56.7, l:73.7, h:16,  rear:0.88, ax:88,  ay:15, fromRear:true, bedY:112},
  {id:'under',ab:'Under box',  name:'Under the box',      reach:30, w:41.5, l:73.7, h:12.5,rear:0.86, ax:150, ay:15, fromRear:true, bedY:112},
  {id:'cabF', ab:'Pass floor', name:'Cab — passenger floor',reach:19,w:20,   l:25,   h:18,  rear:0.30, ax:44,  ay:58, fromRear:false},
  {id:'cabJ', ab:'Jump seats', name:'Cab — jump seats',    reach:30, w:50,   l:20,   h:22,  rear:0.38, ax:12,  ay:86, fromRear:false}
];

/* Tools as real boxes: l × w × h in inches. l is the long dimension. */
const SEED_TOOLS=[
  {id:'lathbag', name:'Lath bag',            cat:'working', l:30,w:10,h:8,  lbs:25, trips:9},
  {id:'hammer',  name:'Framing hammer',      cat:'working', l:16,w:5, h:1.5,lbs:2,  trips:9},
  {id:'pinflag', name:'Pink pin flags',      cat:'working', l:21,w:4, h:4,  lbs:3,  trips:9},
  {id:'marker',  name:'Marker',              cat:'working', l:6, w:2, h:1.5,lbs:0.5,trips:8},
  {id:'flagging',name:'Flagging tape',       cat:'working', l:6, w:6, h:4,  lbs:3,  trips:8},
  {id:'tacks',   name:'Tacks',               cat:'working', l:5, w:4, h:2,  lbs:2,  trips:7},
  {id:'laser',   name:'Level laser',         cat:'working', l:14,w:10,h:5,  lbs:12, trips:5},
  {id:'gradestk',name:'Grade stick',         cat:'working', l:48,w:3, h:2,  lbs:5,  trips:5},
  {id:'rebar',   name:'Rebar 5/8×12 + caps', cat:'working', l:12,w:5, h:4,  lbs:28, trips:3},
  {id:'tape25',  name:"25' tape",            cat:'working', l:4, w:4, h:2,  lbs:1,  trips:8},
  {id:'tape100', name:"100' tape",           cat:'working', l:8, w:8, h:3,  lbs:4,  trips:4},
  {id:'gps',     name:'GPS rover + pole',    cat:'instrument',l:50,w:6,h:6, lbs:18, trips:12},
  {id:'dc',      name:'Data collector',      cat:'instrument',l:10,w:7,h:3, lbs:3,  trips:12},
  {id:'plans',   name:'Tablet / plans',      cat:'instrument',l:12,w:9,h:2, lbs:3,  trips:12},
  {id:'batt',    name:'Batteries',           cat:'instrument',l:12,w:8,h:5, lbs:7,  trips:3},
  {id:'water',   name:'Water cooler',        cat:'truck',   l:14,w:14,h:16, lbs:25, trips:6},
  {id:'cones',   name:'Cones (4)',           cat:'truck',   l:28,w:14,h:14, lbs:12, trips:3},
  {id:'vest',    name:'Vest + hard hat',     cat:'truck',   l:14,w:12,h:6,  lbs:4,  trips:2},
  {id:'shovel',  name:'Shovel',              cat:'truck',   l:48,w:9, h:4,  lbs:5,  trips:2},
  {id:'machete', name:'Machete',             cat:'truck',   l:24,w:3, h:2,  lbs:3,  trips:2},
  {id:'lathbulk',name:'Lath ×2 bundles',     cat:'stock',   l:48,w:12,h:6,  lbs:85, trips:1.5},
  {id:'hubbulk', name:'Hubs ×2 bundles',     cat:'stock',   l:14,w:12,h:12, lbs:120,trips:1.5},
  {id:'flagbulk',name:'Pin flags ×5 bundles',cat:'stock',   l:22,w:10,h:10, lbs:40, trips:1},
  {id:'suppbulk',name:'Tacks/flagging stock',cat:'stock',   l:12,w:10,h:8,  lbs:12, trips:0.5}
];

const CAT_COLOR={working:'#7fb3e0', instrument:'#a8cf8a', truck:'#e8b877', stock:'#d79a9a'};

let DB={conts:[],tools:[],pack:{},box:{dL:14,dP:14,...BOXDEF}};
let tab='pack', drag=null, selCont=null;

const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);
const num=(v,d)=>{const n=parseFloat(v);return Number.isFinite(n)?n:d;};
const fmtMin=sec=>(sec/60).toFixed(1);
function toast(m){const t=el('toast');t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2200);}
const cont=id=>DB.conts.find(c=>c.id===id);
const tool=id=>DB.tools.find(t=>t.id===id);

function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(DB_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.tools)DB=d;}}catch(e){}
  if(!DB.conts?.length)DB.conts=structuredClone(SEED_CONTS);
  if(!DB.tools?.length)DB.tools=structuredClone(SEED_TOOLS);
  DB.box={dL:14,dP:14,...BOXDEF,...(DB.box||{})};
  DB.pack||={};
  syncBox();
  if(!Object.keys(DB.pack).length)autoPack(true);
}
function resetAll(){
  if(!confirm('Throw away your edits and start from the seeded truck?'))return;
  DB={conts:structuredClone(SEED_CONTS),tools:structuredClone(SEED_TOOLS),pack:{},box:{dL:14,dP:14,...BOXDEF}};
  syncBox();autoPack(true);save();render();
}
function emptyAll(){DB.pack={};save();render();}

/* The box compartments are entirely derived from the two dividers. The
   cubbies sit at the tailgate end; the bays take what is left. */
function syncBox(){
  const B=DB.box, wall=B.wall??BOXDEF.wall, outerW=B.outerW??BOXDEF.outerW;
  // three bays, two internal dividers, two outer walls
  const bayW=+((outerW-4*wall)/BOX.bays).toFixed(2);
  const gap=+((BOX.bedW-outerW)/2).toFixed(2);       // the slim side channel
  const boxLeft=BOX.x0+gap;
  const bayX=i=>+(boxLeft+wall+i*(bayW+wall)).toFixed(2);

  const set=(bayId,cubId,d,i)=>{
    const bay=cont(bayId), cub=cont(cubId);
    if(!bay||!cub)return;
    bay.w=cub.w=bayW; bay.ax=cub.ax=bayX(i);
    cub.l=d;       cub.ay=BOX.yRear-d;  cub.bedY=cub.ay;
    bay.l=BOX.L-d; bay.ay=BOX.yFront;   bay.bedY=bay.ay;
  };
  set('boxD','cubD',B.dL,0);
  set('boxP','cubP',B.dP,2);
  const c=cont('boxC');
  if(c){c.w=bayW;c.ax=bayX(1);c.l=BOX.L;c.ay=BOX.yFront;c.bedY=BOX.yFront;}
  for(const [id,x] of [['sideD',BOX.x0],['sideP',boxLeft+outerW]]){
    const ch=cont(id);
    if(!ch)continue;
    ch.w=Math.max(0.5,gap); ch.l=BOX.L; ch.h=B.sideH??BOXDEF.sideH;
    ch.ax=+x.toFixed(2); ch.ay=BOX.yFront; ch.bedY=BOX.yFront;
  }
}

/* ── geometry ─────────────────────────────────────────────────────
   A tool's long dimension runs along the truck unless it is rotated.  */
const fp=(t,rot)=>rot?{fw:t.l,fl:t.w}:{fw:t.w,fl:t.l};
const packed=cid=>DB.tools.filter(t=>DB.pack[t.id]?.c===cid);
const bedYOf=c=>c.bedY??BOX.yFront;

function fitsAt(t,c,x,y,rot,ignoreId){
  if(t.h>c.h+1e-6)return false;                       // lid will not close
  const {fw,fl}=fp(t,rot);
  if(x<-1e-6||y<-1e-6||x+fw>c.w+1e-6||y+fl>c.l+1e-6)return false;
  for(const o of packed(c.id)){
    if(o.id===t.id||o.id===ignoreId)continue;
    const p=DB.pack[o.id], of=fp(o,p.rot);
    if(x<p.x+of.fw-1e-6 && x+fw>p.x+1e-6 && y<p.y+of.fl-1e-6 && y+fl>p.y+1e-6)return false;
  }
  return true;
}
/* the tailgate is the end you stand at, so the far end of a long bay
   costs real seconds */
function reachFor(t){
  const p=DB.pack[t.id];
  if(!p)return LOOSE_REACH;
  const c=cont(p.c);
  if(!c)return LOOSE_REACH;
  if(!c.fromRear)return c.reach;
  const rearEdge=bedYOf(c)+p.y+fp(t,p.rot).fl;
  return c.reach+Math.max(0,(BOX.yRear-rearEdge))/12*REACH_PER_FT;
}
function score(){
  let sec=0,loose=0,lbs=0,rear=0,behind=0,used=0,cap=0;
  const per=[];
  for(const t of DB.tools){
    const r=reachFor(t), s=t.trips*2*r;
    sec+=s; if(!DB.pack[t.id])loose++;
    per.push({t,sec:s,reach:r});
    lbs+=t.lbs;
    const c=DB.pack[t.id]?cont(DB.pack[t.id].c):null;
    rear+=t.lbs*(c?c.rear:0.88);
    if(c&&c.rear>=0.98)behind+=t.lbs;
  }
  for(const c of DB.conts){
    cap+=c.w*c.l;
    for(const t of packed(c.id)){const f=fp(t,DB.pack[t.id].rot);used+=f.fw*f.fl;}
  }
  per.sort((a,b)=>b.sec-a.sec);
  return {sec,min:sec/60,loose,lbs,rear,behind,rearPct:lbs?rear/lbs:0,
          fill:cap?used/cap:0,per};
}

/* ── auto-pack: hot things first, as close to the tailgate as they go ── */
function autoPack(quiet){
  const before=score().sec;
  DB.pack={};
  const tools=DB.tools.slice().sort((a,b)=>b.trips-a.trips);
  const conts=DB.conts.slice().sort((a,b)=>a.reach-b.reach);
  for(const t of tools){
    let done=false;
    for(const c of conts){
      if(t.h>c.h)continue;
      for(const rot of [0,1]){
        const {fw,fl}=fp(t,rot);
        if(fw>c.w||fl>c.l)continue;
        // scan from the tailgate end forward — that is the cheap end
        for(let y=Math.floor(c.l-fl);y>=0&&!done;y--)
          for(let x=0;x<=c.w-fw;x++){
            if(fitsAt(t,c,x,y,rot)){DB.pack[t.id]={c:c.id,x,y,rot};done=true;break;}
          }
        if(done)break;
      }
      if(done)break;
    }
  }
  save();
  if(!quiet){
    render();
    const d=(before-score().sec)/60;
    toast(d>0.1?`${d.toFixed(1)} min/day less fetching`:'packed');
  }
}

function dividers(){
  return [['dL','cubD'],['dP','cubP']].map(([k,cubId])=>{
    const c=cont(cubId), y=c.ay;
    return `<g class="divider" data-k="${k}">
      <line class="dline" x1="${c.ax}" y1="${y}" x2="${c.ax+c.w}" y2="${y}"></line>
      <line class="dgrab" x1="${c.ax}" y1="${y}" x2="${c.ax+c.w}" y2="${y}"></line>
      <text class="dlbl" x="${c.ax+c.w/2}" y="${y-1.2}" text-anchor="middle">${DB.box[k]}" ⇕</text>
    </g>`;
  }).join('');
}
function pickPending(id){pending=pending===id?null:id;render();}

function wirePack(){
  const svg=document.querySelector('svg.pack');
  if(!svg)return;
  const toLocal=e=>{
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  const contAt=(px,py)=>DB.conts.find(c=>px>=c.ax&&px<=c.ax+c.w&&py>=c.ay&&py<=c.ay+c.l);

  // drop a tray item
  for(const r of svg.querySelectorAll('[data-cont]')){
    r.addEventListener('pointerdown',e=>{
      if(!pending)return;
      const loc=toLocal(e), c=cont(r.dataset.cont), t=tool(pending);
      const f=fp(t,0);
      let x=Math.round((loc.x-c.ax-f.fw/2)*2)/2, y=Math.round((loc.y-c.ay-f.fl/2)*2)/2;
      const spot=findSpot(t,c,x,y);
      if(!spot)return toast(whyNoFit(t,c));
      DB.pack[t.id]=spot;pending=null;save();render();
    });
  }

  // move / rotate / unpack an item
  for(const g of svg.querySelectorAll('.item')){
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      const id=g.dataset.tool, t=tool(id), p=DB.pack[id], c=cont(p.c);
      const start=toLocal(e);
      const grabX=start.x-(c.ax+p.x), grabY=start.y-(c.ay+p.y);
      let moved=false;
      g.setPointerCapture(e.pointerId);
      g.classList.add('drag');
      const rect=g.querySelector('rect'), txt=g.querySelector('text');
      const move=ev=>{
        const loc=toLocal(ev);
        if(Math.abs(loc.x-start.x)>1||Math.abs(loc.y-start.y)>1)moved=true;
        rect.setAttribute('x',loc.x-grabX);rect.setAttribute('y',loc.y-grabY);
        if(txt){txt.setAttribute('x',loc.x-grabX+1);txt.setAttribute('y',loc.y-grabY+3.2);}
      };
      const up=ev=>{
        g.removeEventListener('pointermove',move);
        g.removeEventListener('pointerup',up);
        g.classList.remove('drag');
        if(!moved){                                  // a tap is a rotate
          const spot=findSpot(t,c,p.x,p.y,1-p.rot,true);
          if(spot)DB.pack[id]=spot; else toast('no room to turn it');
          save();render();return;
        }
        const loc=toLocal(ev);
        const target=contAt(loc.x,loc.y);
        if(!target){delete DB.pack[id];save();render();toast(`${t.name} is loose again`);return;}
        let x=Math.round((loc.x-grabX-target.ax)*2)/2, y=Math.round((loc.y-grabY-target.ay)*2)/2;
        const spot=findSpot(t,target,x,y,p.rot);
        if(spot)DB.pack[id]=spot; else toast(whyNoFit(t,target));
        save();render();
      };
      g.addEventListener('pointermove',move);
      g.addEventListener('pointerup',up);
    });
  }
  wireDividers(svg,toLocal);
}

/* "It does not fit" is useless on its own — the box is 5.5" deep and most
   of what a crew grabs is taller than that, so say which dimension lost. */
function whyNoFit(t,c){
  if(t.h>c.h)return `${t.name} is ${t.h}" tall — ${c.name} is only ${c.h}" deep`;
  const short=Math.min(t.l,t.w), long=Math.max(t.l,t.w);
  if(short>c.w&&short>c.l)return `${t.name} is ${short}" at its narrowest — ${c.name} is ${c.w.toFixed(0)}×${c.l.toFixed(0)}"`;
  if(long>c.l&&long>c.w)return `${t.name} is ${long}" long — ${c.name} is ${c.l.toFixed(0)}×${c.w.toFixed(0)}"`;
  return `no clear floor left in ${c.name} — move something out first`;
}

/* Try where they dropped it, then spiral out a little, then give up. */
function findSpot(t,c,x,y,rot=0,mustRotate){
  const tryRot=mustRotate?[rot]:[rot,1-rot];
  for(const r of tryRot){
    const {fw,fl}=fp(t,r);
    if(t.h>c.h||fw>c.w||fl>c.l)continue;
    const cx=Math.min(Math.max(0,x),c.w-fw), cy=Math.min(Math.max(0,y),c.l-fl);
    if(fitsAt(t,c,cx,cy,r,t.id))return {c:c.id,x:cx,y:cy,rot:r};
    for(let d=1;d<=Math.max(c.w,c.l);d++){
      for(const [dx,dy] of [[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,-d],[d,-d],[-d,d]]){
        const nx=Math.min(Math.max(0,cx+dx),c.w-fw), ny=Math.min(Math.max(0,cy+dy),c.l-fl);
        if(fitsAt(t,c,nx,ny,r,t.id))return {c:c.id,x:nx,y:ny,rot:r};
      }
    }
  }
  return null;
}

function wireDividers(svg,toLocal){
  for(const g of svg.querySelectorAll('.divider')){
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      const k=g.dataset.k;
      g.setPointerCapture(e.pointerId);
      const move=ev=>{
        const loc=toLocal(ev);
        const d=Math.round(Math.min(BOX.maxCub,Math.max(BOX.minCub,BOX.yRear-loc.y)));
        if(d===DB.box[k])return;
        DB.box[k]=d;syncBox();
      };
      const up=()=>{
        g.removeEventListener('pointermove',move);
        g.removeEventListener('pointerup',up);
        // anything the divider just cut through has to come out
        let bumped=0;
        for(const t of DB.tools){
          const p=DB.pack[t.id];if(!p)continue;
          const c=cont(p.c);if(!c)continue;
          if(!fitsAt(t,c,p.x,p.y,p.rot,t.id)||p.y+fp(t,p.rot).fl>c.l+1e-6){
            const spot=findSpot(t,c,p.x,p.y,p.rot);
            if(spot)DB.pack[t.id]=spot; else {delete DB.pack[t.id];bumped++;}
          }
        }
        save();render();
        if(bumped)toast(`${bumped} item${bumped>1?'s':''} no longer fit`);
      };
      g.addEventListener('pointermove',move);
      g.addEventListener('pointerup',up);
    });
  }
}

function editTool(id,k,v){
  const t=tool(id);if(!t)return;
  t[k]=(k==='name'||k==='cat')?v:Math.max(0,num(v,0));
  const p=DB.pack[id];
  if(p){const c=cont(p.c);const spot=c&&findSpot(t,c,p.x,p.y,p.rot);
        if(spot)DB.pack[id]=spot; else delete DB.pack[id];}
  save();setTimeout(render,0);
}
function addTool(){
  DB.tools.push({id:uid(),name:'New tool',cat:'working',l:8,w:6,h:4,lbs:5,trips:1});
  save();render();
}
function delTool(id){DB.tools=DB.tools.filter(t=>t.id!==id);delete DB.pack[id];save();render();}

function contsView(S){
  const rows=DB.conts.slice().sort((a,b)=>a.reach-b.reach).map(c=>{
    const inside=packed(c.id);
    const used=inside.reduce((a,t)=>{const f=fp(t,DB.pack[t.id].rot);return a+f.fw*f.fl;},0);

    const box=DB.box&&['boxD','boxP','cubD','cubP','boxC'].includes(c.id);
    return `<tr>
      <td>${esc(c.name)}${box?' <span class="tag">from the dividers</span>':''}</td>
      <td><input class="num" value="${c.reach}" onchange="editCont('${c.id}','reach',this.value)"></td>
      <td class="meta" style="font-family:var(--mono)">${c.l.toFixed(0)}×${c.w.toFixed(0)}×${c.h}"</td>
      <td class="meta" style="font-family:var(--mono)">${Math.round(used/(c.w*c.l)*100)}%</td>
      <td class="meta" style="font-family:var(--mono)">${inside.length} · ${Math.round(lbs)} lb</td>
      <td><input class="num" value="${c.rear}" onchange="editCont('${c.id}','rear',this.value)"></td>
    </tr>`;
  }).join('');
  return `<div class="panel"><div class="panel-head"><h3>${esc(TRUCK.name)}</h3></div>
      <div class="panel-body"><div class="hint">
        Bed ${TRUCK.bedL}" × ${TRUCK.bedW}", ${TRUCK.bedWells}" between the wheel wells, ${TRUCK.bedD}" deep.
        Payload about ${TRUCK.payload} lb including people.<br><br>
        <b>The box</b> runs the whole length of the bed and is narrower than it, which is what leaves
        the slim channel down each side.
      </div>
      <div class="cols" style="margin-top:10px">
        <div><label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">Box outer width in</label>
          <input class="num" style="max-width:90px" value="${DB.box.outerW}" onchange="editBox('outerW',this.value)"></div>
        <div><label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">Wall / divider in</label>
          <input class="num" style="max-width:90px" value="${DB.box.wall}" onchange="editBox('wall',this.value)"></div>
        <div><label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)">Side channel depth in</label>
          <input class="num" style="max-width:90px" value="${DB.box.sideH}" onchange="editBox('sideH',this.value)"></div>
      </div>
      <div class="hint" style="margin-top:8px">
        At ${DB.box.outerW}" outside with ${DB.box.wall}" stock, each bay comes out
        ${cont('boxD')?cont('boxD').w.toFixed(1):'—'}" wide and each side channel
        ${cont('sideD')?cont('sideD').w.toFixed(1):'—'}". The frame is 2x6, so ${BOX.depth}" is the
        inside depth — that one number rules more things out of the box than anything else.
      </div></div></div>
    <div class="panel"><div class="panel-head"><h3>Compartments</h3>
      <span class="n">reach seconds is the one number worth timing</span></div>
      <div class="panel-body flush"><table>
        <thead><tr><th>Compartment</th><th>Reach s</th><th>L×W×H</th><th>Floor used</th><th>Holding</th><th>Rear axle</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="panel-body"><div class="hint">
        <b>Reach</b> = walk to it, open it, get the thing, be back at the work, standing at the tailgate.
        A long bay costs more at the far end — ${REACH_PER_FT}s per foot up the bed — which is why the
        auto-pack fills from the tailgate forward.
      </div></div></div>`;
}
function editBox(k,v){
  DB.box[k]=Math.max(0.5,num(v,1));
  syncBox();
  // re-seat anything the new geometry pushed out
  for(const t of DB.tools){
    const p=DB.pack[t.id];if(!p)continue;
    const c=cont(p.c);
    const spot=c&&findSpot(t,c,p.x,p.y,p.rot);
    if(spot)DB.pack[t.id]=spot; else delete DB.pack[t.id];
  }
  save();setTimeout(render,0);
}
function editCont(id,k,v){
  const c=cont(id);if(!c)return;
  c[k]=Math.max(0,num(v,0));save();setTimeout(render,0);
}

/* ── the sheet ───────────────────────────────────────────────────── */
function sheetView(S){
  const cs=DB.conts.slice().sort((a,b)=>a.reach-b.reach);
  const body=cs.map(c=>{
    const inside=packed(c.id).sort((a,b)=>b.trips-a.trips);
    return `<div class="sheet-zone">
      <h4>${esc(c.name)} <span class="cap">${c.reach}s · ${c.l.toFixed(0)}×${c.w.toFixed(0)}×${c.h}"</span></h4>
      ${inside.length?`<ul>${inside.map(t=>{
        const p=DB.pack[t.id];
        const d=c.fromRear?Math.max(0,BOX.yRear-((c.bedY??BOX.yFront)+p.y+fp(t,p.rot).fl)):null;
        return `<li>${esc(t.name)} <span class="cap">${p.rot?'turned · ':''}${d==null?'':`${d.toFixed(0)}" in from the tailgate`}</span>${t.trips>=8?' <b>(hot)</b>':''}</li>`;
      }).join('')}</ul>`:`<div class="hint" style="margin-top:4px">— empty —</div>`}</div>`;
  }).join('');
  const loose=DB.tools.filter(t=>!DB.pack[t.id]);
  return `<div class="sheet">
    <h2>Truck layout — standard</h2>
    <div class="sub">${esc(TRUCK.name)} · ${fmtMin(S.sec)} min/day of fetching ·
      ${Math.round(S.lbs)} lb of tools · ${Math.round(S.fill*100)}% of the floor used</div>
    ${body}
    ${loose.length?`<div class="sheet-zone"><h4 style="color:var(--red)">Would not fit anywhere</h4>
      <ul>${loose.map(t=>`<li>${esc(t.name)} — ${t.l}×${t.w}×${t.h}"</li>`).join('')}</ul></div>`:''}
    <div class="hint" style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
      Print this and tape it inside a lid. A layout only saves time if every truck matches it and
      a thing goes back where it came from.</div>
    <div style="margin-top:12px"><button class="btn" onclick="window.print()">print</button>
      <button class="btn" onclick="exportJson()">export JSON</button></div>
  </div>`;
}

async function exportJson(){
  const json=JSON.stringify(DB,null,2);
  const filename=`truck-layout-${new Date().toISOString().slice(0,10)}.json`;
  const host=window.claude;
  if(host&&typeof host.use==='function'){
    try{const d=await host.use('downloads');
        if(d){await d.save({filename,data:json});toast('exported');return;}}
    catch(e){toast(e?.code==='declined'?'export cancelled':'export failed');return;}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('exported');
}

load();render();
</script>
</body>
</html>
