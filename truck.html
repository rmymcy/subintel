<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truck Lab</title>
<meta name="description" content="A rough time-and-motion model for where tools live in a survey truck, and which bags are worth making.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>
:root{
  --bg:#f5f5f7;--bg-soft:#e8e8ed;--bg-panel:#fff;--border:#d1d1d6;--border-soft:#e4e4e9;
  --text:#1d1c18;--muted:#696660;--faint:#95928c;
  --blue:#1e4974;--blue-soft:#2e5d8b;--blue-deep:#143659;--blue-wash:#e7eef6;
  --red:#a82626;--red-wash:#f5e3e3;--green:#5c7f3f;--green-wash:#eef1e3;
  --amber:#b07419;--amber-wash:#fae9c4;--amber-ink:#7a5210;--orange:#c2521f;--orange-wash:#fbe7dc;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.04);
  --shadow-lg:0 8px 22px rgba(0,0,0,.10),0 3px 6px rgba(0,0,0,.05);
  --radius:8px;--radius-sm:5px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181c;--bg-soft:#22252b;--bg-panel:#1d2025;--border:#33373f;--border-soft:#2a2e35;
  --text:#e9e8e4;--muted:#9a978f;--faint:#6d6a64;
  --blue:#6ea3d8;--blue-soft:#8bb8e6;--blue-deep:#0f2740;--blue-wash:#1c2c3d;
  --red:#e08080;--red-wash:#3a2222;--green:#a3c47d;--green-wash:#26301c;
  --amber:#e0a94a;--amber-wash:#3a2e14;--amber-ink:#e8c37c;--orange:#e0895b;--orange-wash:#3a2318;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 8px 22px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#16181c;--bg-soft:#22252b;--bg-panel:#1d2025;--border:#33373f;--border-soft:#2a2e35;
  --text:#e9e8e4;--muted:#9a978f;--faint:#6d6a64;
  --blue:#6ea3d8;--blue-soft:#8bb8e6;--blue-deep:#0f2740;--blue-wash:#1c2c3d;
  --red:#e08080;--red-wash:#3a2222;--green:#a3c47d;--green-wash:#26301c;
  --amber:#e0a94a;--amber-wash:#3a2e14;--amber-ink:#e8c37c;--orange:#e0895b;--orange-wash:#3a2318;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 8px 22px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:9px;padding:9px 12px 9px 52px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.ver{font-size:10px;color:var(--faint);font-weight:500}
.spacer{flex:1}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-panel);font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--bg-soft)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-soft)}
.btn-danger{color:var(--red);border-color:var(--red);background:transparent}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-icon{padding:5px 8px;font-size:13px;line-height:1}

/* KPI strip */
#kpis{display:flex;gap:0;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.kpi{padding:8px 14px;border-right:1px solid var(--border-soft);min-width:112px;flex-shrink:0}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1.2}
.kpi .s{font-size:10.5px;color:var(--faint)}
.kpi .v.good{color:var(--green)}.kpi .v.warn{color:var(--amber)}.kpi .v.bad{color:var(--red)}

/* tabs */
#tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:8px 13px;font:inherit;font-size:12.5px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1280px;margin:0 auto}
.split{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}

.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.panel-head h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel-head .n{font-size:10px;color:var(--faint);font-weight:600}
.panel-body{padding:12px}
.panel-body.flush{padding:0}
.hint{font-size:11px;color:var(--faint);line-height:1.45}

/* truck plan */
svg.plan{width:100%;height:auto;display:block;background:var(--bg);border-radius:var(--radius)}
.zone-rect{cursor:pointer;transition:opacity .1s}
.zone-rect:hover{opacity:.85}
.zone-lbl{font-size:3.1px;font-weight:700;fill:var(--text);pointer-events:none;font-family:var(--font)}
.zone-sub{font-size:2.3px;fill:var(--muted);pointer-events:none;font-family:var(--mono)}
.truck-body{fill:none;stroke:var(--border);stroke-width:2}
.truck-note{font-size:2.6px;fill:var(--faint);font-family:var(--font)}

/* lists */
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg)}
.row.sel{background:var(--blue-wash)}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .meta{font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.row .pick{cursor:pointer}
.tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:1px 5px;background:var(--bg-soft);color:var(--muted);flex-shrink:0}
.tag.hot{background:var(--orange-wash);color:var(--orange)}
.tag.zone{background:var(--blue-wash);color:var(--blue)}
.tag.save{background:var(--green-wash);color:var(--green)}
.bar{height:5px;border-radius:3px;background:var(--bg-soft);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar>i.warn{background:var(--amber)}.bar>i.bad{background:var(--red)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
td input,td select{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;font:inherit;font-size:12px;background:transparent;color:var(--text)}
td input:hover,td select:hover{border-color:var(--border)}
td input:focus,td select:focus{outline:none;border-color:var(--blue-soft);background:var(--bg)}
td input.num{font-family:var(--mono);text-align:right;max-width:74px}
tr.dead td{opacity:.4}

.pillrow{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--bg-soft);color:var(--muted);font-weight:600}
.pill.on{background:var(--blue-wash);color:var(--blue)}

.kit{border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:9px;background:var(--bg-panel)}
.kit h4{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kit .why{font-size:11.5px;color:var(--muted);margin:4px 0 7px;line-height:1.45}

.cmp{display:flex;flex-direction:column;gap:9px}
.cmp-row{display:flex;align-items:center;gap:9px}
.cmp-row .lab{width:118px;font-size:11.5px;font-weight:600;flex-shrink:0}
.cmp-row .track{flex:1;height:22px;background:var(--bg-soft);border-radius:4px;overflow:hidden;position:relative}
.cmp-row .fill{height:100%;background:var(--blue);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.cmp-row .fill.best{background:var(--green)}

.sheet{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.sheet h2{font-size:17px;margin-bottom:2px}
.sheet .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.sheet-zone{border-top:1px solid var(--border);padding:9px 0}
.sheet-zone h4{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.sheet-zone .cap{font-size:10.5px;color:var(--muted);font-family:var(--mono);font-weight:500}
.sheet-zone ul{margin:5px 0 0 16px;font-size:12px;line-height:1.6}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--blue-deep);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);transition:transform .18s;z-index:100;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media print{header,#tabs,#kpis,.btn{display:none!important}body{overflow:visible}main{overflow:visible;padding:0}}
</style>
</head>
<body>

<header>
  <h1>Truck Lab <span class="ver">v0.1 · rough model</span></h1>
  <span class="spacer"></span>
  <button class="btn" onclick="optimize()">⚙ Optimize placement</button>
  <button class="btn" onclick="resetAll()">reset</button>
  <button class="btn btn-icon" onclick="toggleTheme()" title="light / dark">◐</button>
</header>

<div id="kpis"></div>

<div id="tabs">
  <button class="tab on" data-tab="layout" onclick="setTab('layout')">Layout</button>
  <button class="tab" data-tab="tools" onclick="setTab('tools')">Tools</button>
  <button class="tab" data-tab="zones" onclick="setTab('zones')">Truck zones</button>
  <button class="tab" data-tab="sheet" onclick="setTab('sheet')">Layout sheet</button>
</div>

<main><div class="wrap" id="view"></div></main>
<div id="toast"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════
   Truck Lab — a rough time-and-motion model for a survey truck.

   The whole model is one idea: every tool gets fetched some number of
   times a day, and every spot in the truck costs some number of seconds
   to fetch from. Minutes per day of fetching is the score. That is
   enough to rank layouts against each other and to see which bags are
   worth making. It is NOT a physics or packing simulation — volumes are
   rough, the reach times are estimates you should edit to match your
   trucks, and nothing here knows what your bed actually looks like.
   ══════════════════════════════════════════════════════════════════ */
const DB_KEY='truckLabDB';
const THEME_KEY='truckLabTheme';

/* The truck: 2021 Tacoma Access Cab. That is the 6-foot bed —
   73.7" long, 56.7" wide at the rails, 41.5" between the wheel wells,
   19.1" deep, about 49 cu ft. Overall 212.3" long, 74.4" wide. Payload
   is trim-dependent; 1,175 lb is the common figure and it is editable.
   Access Cab matters here: the back is jump seats behind rear-hinged
   half doors, so it is small AND slow to get into — you have to open
   the front door first. That is why cabJ costs 30 seconds.
   All plan coordinates below are inches. */
const TRUCK={name:'2021 Toyota Tacoma — Access Cab, 6\' bed',
  bedL:73.7, bedW:56.7, bedWells:41.5, bedD:19.1, bedCuFt:49.4, payload:1175,
  box:'Wooden box on the wheel wells — 2x6 frame, about 5.5" deep inside. Three '
     +'bays across the width, plus one divider in the driver bay and one in the '
     +'passenger bay making a cubby at the back of each. Five compartments total; '
     +'the center bay runs the full depth. The bays run front-to-back, so the side '
     +'bays take about 20" and the center about 30" — no compartment holds a 48" '
     +'lath, which is why lath rides on top or on a rack. The box also buries the '
     +'space under it: around 9 cu ft of real volume that you have to reach past '
     +'the box to use.'};

const SEED_ZONES=[
  {id:'tail',  name:'Bed floor — behind the box', ab:'Behind box', reach:6, vol:11.7,lbs:250,rear:1.02,slots:4, long:true,  x:10,  y:168, w:56.7,h:17.7},
  {id:'cubD',  name:'Driver cubby (rear)',        ab:'Drv cubby',  reach:7, vol:0.6, lbs:25, rear:0.95,slots:4, long:false, x:10,  y:157, w:18.9,h:10},
  {id:'cubP',  name:'Passenger cubby (rear)',     ab:'Pass cubby', reach:7, vol:0.6, lbs:25, rear:0.95,slots:4, long:false, x:47.8,y:157, w:18.9,h:10},
  {id:'boxD',  name:'Box — driver bay',           ab:'Driver bay', reach:8, vol:1.2, lbs:50, rear:0.90,slots:5, long:false, x:10,  y:137, w:18.9,h:20},
  {id:'boxP',  name:'Box — passenger bay',        ab:'Pass bay',   reach:8, vol:1.2, lbs:50, rear:0.90,slots:5, long:false, x:47.8,y:137, w:18.9,h:20},
  {id:'boxtop',name:'Box top (strapped)',         ab:'Box top',    reach:9, vol:4,   lbs:100,rear:0.90,slots:3, long:true,  x:10,  y:130, w:56.7,h:6},
  {id:'boxC',  name:'Box — center bay',           ab:'Center bay', reach:12,vol:1.8, lbs:70, rear:0.90,slots:6, long:false, x:28.9,y:137, w:18.9,h:30},
  {id:'cabF',  name:'Cab — passenger floor',      ab:'Pass floor', reach:19,vol:4,   lbs:60, rear:0.30,slots:4, long:false, x:42,  y:62,  w:25,  h:20},
  {id:'bedF',  name:'Bed floor — headboard',      ab:'Headboard',  reach:26,vol:15,  lbs:300,rear:0.74,slots:4, long:true,  x:10,  y:113, w:56.7,h:16},
  {id:'cabJ',  name:'Cab — jump seats',           ab:'Jump seats', reach:30,vol:4,   lbs:80, rear:0.38,slots:4, long:true,  x:10,  y:86,  w:57,  h:20},
  {id:'under', name:'Under the box (between wells)',ab:'Under box',reach:30,vol:9,   lbs:250,rear:0.88,slots:2, long:true,  x:39.7,y:3,   w:27,  h:14},
  {id:'rack',  name:'Bed rack — overhead',        ab:'Bed rack',   reach:40,vol:10,  lbs:150,rear:0.75,slots:4, long:true,  x:10,  y:3,   w:27,  h:14}
];

/* The actual kit. Two different animals live in this list and the split
   matters more than anything else in the model:

   WORKING SUPPLY — what goes to the lot. Small, light, grabbed all day.
   WEEK STOCK — the bundles. Heavy, bulky, touched once or twice a day to
   refill the working supply. Optimizing these two the same way is how a
   truck ends up with 120 lb of hubs in the easiest spot in the bed and
   the hammer buried behind it.

   long:true means it will not go in a rail box — 48" lath, the grade
   stick, a rover pole. The crossover is 56.7" wide, so lath does fit
   there; that is not an accident of the model, it is the bed. */
const SEED_TOOLS=[
  // working supply
  {id:'lathbag', name:'Lath bag (working kit)',      cat:'working', vol:1.5, lbs:25, trips:9,  long:true},
  {id:'hammer',  name:'Framing hammer',              cat:'working', vol:0.15,lbs:2,  trips:9},
  {id:'pinflag', name:'Pink pin flags — working',    cat:'working', vol:0.25,lbs:3,  trips:9},
  {id:'marker',  name:'Marker / lumber crayon',      cat:'working', vol:0.05,lbs:0.5,trips:8},
  {id:'flagging',name:'Flagging tape',               cat:'working', vol:0.3, lbs:3,  trips:8},
  {id:'tacks',   name:'Tacks',                       cat:'working', vol:0.1, lbs:2,  trips:7},
  {id:'laser',   name:'Level laser',                 cat:'working', vol:0.8, lbs:12, trips:5},
  {id:'gradestk',name:'Grade stick for the laser',   cat:'working', vol:0.6, lbs:5,  trips:5,  long:true},
  {id:'rebar',   name:'Rebar 5/8" × 12" + caps',     cat:'working', vol:0.6, lbs:28, trips:3},
  {id:'tape25',  name:"25' tape",                    cat:'working', vol:0.1, lbs:1,  trips:8},
  {id:'tape100', name:"100' tape",                   cat:'working', vol:0.5, lbs:4,  trips:4},
  // instruments
  {id:'gps',     name:'GPS rover + pole',            cat:'instrument',vol:1.8,lbs:18,trips:12, long:true},
  {id:'dc',      name:'Data collector',              cat:'instrument',vol:0.3,lbs:3, trips:12},
  {id:'plans',   name:'Tablet / plans',              cat:'instrument',vol:0.3,lbs:3, trips:12},
  {id:'batt',    name:'Batteries + chargers',        cat:'instrument',vol:0.5,lbs:7, trips:3},
  // truck stuff
  {id:'water',   name:'Water cooler',                cat:'truck',   vol:2.0, lbs:25, trips:6},
  {id:'cones',   name:'Traffic cones (4)',           cat:'truck',   vol:2.5, lbs:12, trips:3},
  {id:'vest',    name:'Vest + hard hat',             cat:'truck',   vol:0.8, lbs:4,  trips:2},
  {id:'shovel',  name:'Shovel',                      cat:'truck',   vol:1.2, lbs:5,  trips:2,  long:true},
  {id:'machete', name:'Machete',                     cat:'truck',   vol:0.3, lbs:3,  trips:2},
  // a week of stock
  {id:'lathbulk',name:'Lath 1/2×2×48 — 2 bundles',   cat:'stock',   vol:2.8, lbs:85, trips:1.5,long:true},
  {id:'hubbulk', name:'Hubs 2×2×12 — 2 bundles',     cat:'stock',   vol:2.8, lbs:120,trips:1.5},
  {id:'flagbulk',name:'Pin flags — 5 bundles',       cat:'stock',   vol:2.0, lbs:40, trips:1},
  {id:'suppbulk',name:'Tacks / flagging / caps — stock',cat:'stock',vol:1.0, lbs:12, trips:0.5}
];

/* Roughly how a truck is packed today — the baseline the optimizer gets
   compared against. Change it to match yours before reading anything
   into the before/after number. */
const SEED_PLACE={
  lathbag:'tail', gps:'tail', water:'tail',
  hammer:'cubD', marker:'cubD', machete:'cubD',
  tape25:'cubP', batt:'cubP',
  pinflag:'boxD', tacks:'boxD',
  flagging:'boxP', tape100:'boxP',
  laser:'boxC', rebar:'boxC',
  gradestk:'boxtop', lathbulk:'boxtop',
  dc:'cabF', plans:'cabF', vest:'cabJ',
  cones:'bedF', shovel:'bedF', flagbulk:'bedF',
  hubbulk:'under', suppbulk:'under'
};

/* how bad it is to have a tool with no home — you dig for it */
const LOOSE_REACH=50;
/* a zone past this full starts costing extra: things get buried */
const CRAM_START=0.5, CRAM_COST=2.2;
/* Slots are how many separate things can live somewhere and still be
   found at a glance. A divided box has plenty; an open bed floor has
   about four, because after that it is a pile you dig through. Every
   item past a zone's slots adds this many seconds to everything in it. */
const RUMMAGE=3.0;
let DB={zones:[],tools:[],place:{}};
let tab='layout', selTool=null, selZone=null, lastOpt=null;

const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);
const num=(v,d)=>{const n=parseFloat(v);return Number.isFinite(n)?n:d;};
const mins=sec=>(sec/60);
const fmtMin=sec=>`${(sec/60).toFixed(1)}`;
function toast(m){const t=el('toast');t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2200);}

function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw){const d=JSON.parse(raw);if(d&&d.tools)DB=d;}
  }catch(e){}
  if(!DB.zones?.length)DB.zones=structuredClone(SEED_ZONES);
  if(!DB.tools?.length)DB.tools=structuredClone(SEED_TOOLS);
  if(!DB.place||!Object.keys(DB.place).length)DB.place={...SEED_PLACE};
}
function resetAll(){
  if(!confirm('Throw away your edits and go back to the seeded truck?'))return;
  DB={zones:structuredClone(SEED_ZONES),tools:structuredClone(SEED_TOOLS),place:{...SEED_PLACE}};
  lastOpt=null;save();render();
}

/* ── the model ───────────────────────────────────────────────────── */
const zone=id=>DB.zones.find(z=>z.id===id);
const tool=id=>DB.tools.find(t=>t.id===id);

/* how full each zone is under a given placement */
function loads(place){
  const m={};
  for(const z of DB.zones)m[z.id]={vol:0,lbs:0,n:0};
  for(const t of DB.tools){
    const zid=place[t.id];
    if(!zid||!m[zid])continue;
    m[zid].vol+=t.vol;m[zid].lbs+=t.lbs;m[zid].n++;
  }
  return m;
}
/* the seconds it really costs to get into a zone once it's packed:
   past CRAM_START full, things are behind other things */
function effReach(z,load){
  const fill=z.vol>0?(load?.vol||0)/z.vol:0;
  const crowd=Math.max(0,(load?.n||0)-(z.slots||99))*RUMMAGE;
  return z.reach*(1+Math.max(0,fill-CRAM_START)*CRAM_COST)+crowd;
}
/* the whole score: seconds a day spent fetching, plus what it weighs */
function score(place){
  const L=loads(place);
  let sec=0,homeless=0,lbs=0,rear=0,behind=0;
  const per=[];
  for(const t of DB.tools){
    const zid=place[t.id], z=zid?zone(zid):null;
    const r=z?effReach(z,L[zid]):LOOSE_REACH;
    const s=t.trips*2*r;                    // there and back, every trip
    sec+=s; if(!z)homeless++;
    per.push({tool:t,zid,reach:r,sec:s});
    lbs+=t.lbs; rear+=t.lbs*(z?z.rear:0.9);
    if(z&&z.rear>1)behind+=t.lbs;          // aft of the axle, levering the nose up
  }
  const over=DB.zones.filter(z=>L[z.id].vol>z.vol+1e-9||L[z.id].lbs>z.lbs+1e-9);
  per.sort((a,b)=>b.sec-a.sec);
  return {sec,min:sec/60,homeless,over,lbs,rear,behind,rearPct:lbs?rear/lbs:0,loads:L,per};
}
const fits=place=>{
  const L=loads(place);
  if(DB.tools.some(t=>t.long&&place[t.id]&&!zone(place[t.id])?.long))return false;
  return DB.zones.every(z=>L[z.id].vol<=z.vol+1e-9&&L[z.id].lbs<=z.lbs+1e-9);};

/* ── optimizer ───────────────────────────────────────────────────
   Greedy first: the thing you grab most often gets the easiest spot
   that still has room. Then pair swaps until nothing improves — crude
   local search, but it reliably beats hand-packing on this model.   */
function optimize(){
  const before=score(DB.place);
  const place={};
  const ts=DB.tools.slice().sort((a,b)=>b.trips-a.trips);
  for(const t of ts){
    let best=null,bestR=Infinity;
    const L=loads(place);
    for(const z of DB.zones){
      if(t.long&&!z.long)continue;                      // 48" lath, a rover pole
      if(L[z.id].vol+t.vol>z.vol||L[z.id].lbs+t.lbs>z.lbs)continue;
      const r=effReach(z,{vol:L[z.id].vol+t.vol,n:L[z.id].n+1});
      if(r<bestR){bestR=r;best=z.id;}
    }
    if(best)place[t.id]=best;
  }
  let cur=score(place).sec;
  const ids=ts.map(t=>t.id);
  for(let pass=0;pass<60;pass++){
    let moved=false;
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
      const a=ids[i],b=ids[j];
      if(place[a]===place[b])continue;
      const trial={...place,[a]:place[b],[b]:place[a]};
      if(!fits(trial))continue;
      const s=score(trial).sec;
      if(s<cur-0.01){place[a]=trial[a];place[b]=trial[b];cur=s;moved=true;}
    }
    if(!moved)break;
  }
  DB.place=place;lastOpt=before;save();render();
  const d=before.min-score(DB.place).min;
  toast(d>0.05?`${d.toFixed(1)} min/day less fetching`:'already about as good as this model gets');
}

/* ── chrome ──────────────────────────────────────────────────────── */
function setTab(t){tab=t;selZone=null;render();}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const next=cur?(cur==='dark'?'light':'dark'):(dark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
}
try{const t=localStorage.getItem(THEME_KEY);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}

function render(){
  const S=score(DB.place);
  renderKpis(S);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=el('view');
  v.innerHTML = tab==='layout'?layoutView(S)
              : tab==='tools'?toolsView(S)
              : tab==='zones'?zonesView(S)
              : sheetView(S);
}

function renderKpis(S){
  const payPct=S.lbs/TRUCK.payload;
  el('kpis').innerHTML=`
    <div class="kpi"><div class="l">Fetching</div>
      <div class="v">${fmtMin(S.sec)}</div><div class="s">min / day</div></div>
    <div class="kpi"><div class="l">Per 5-day week</div>
      <div class="v">${(S.min*5/60).toFixed(1)}</div><div class="s">hours</div></div>
    <div class="kpi"><div class="l">No home</div>
      <div class="v ${S.homeless?'bad':'good'}">${S.homeless}</div><div class="s">tools loose</div></div>
    <div class="kpi"><div class="l">Over capacity</div>
      <div class="v ${S.over.length?'bad':'good'}">${S.over.length}</div><div class="s">zones</div></div>
    <div class="kpi"><div class="l">Tool weight</div>
      <div class="v">${Math.round(S.lbs)}</div><div class="s">lbs</div></div>
    <div class="kpi"><div class="l">Payload used</div>
      <div class="v ${payPct>0.6?'bad':payPct>0.35?'warn':'good'}">${Math.round(payPct*100)}%</div>
      <div class="s">of ${TRUCK.payload} lb</div></div>
    <div class="kpi"><div class="l">Behind rear axle</div>
      <div class="v ${S.behind>120?'warn':'good'}">${Math.round(S.behind)}</div>
      <div class="s">lbs at the tailgate</div></div>`;
}

/* ── layout: the truck plan, and what is in each zone ────────────── */
function layoutView(S){
  const L=S.loads;
  const rects=DB.zones.map(z=>{
    const ld=L[z.id],fill=z.vol?ld.vol/z.vol:0;
    const over=ld.vol>z.vol+1e-9||ld.lbs>z.lbs+1e-9;
    const col=over?'var(--red)':fill>0.85?'var(--amber)':fill>0.35?'var(--blue)':'var(--green)';
    const on=selZone===z.id;
    return `<g class="zone-rect" onclick="selZone=selZone==='${z.id}'?null:'${z.id}';render()">
      <rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="1.6"
            fill="${col}" fill-opacity="${0.10+Math.min(fill,1)*0.42}"
            stroke="${on?'var(--text)':col}" stroke-width="${on?1.1:0.5}"></rect>
      ${z.w<22
        ? `<text class="zone-lbl" transform="translate(${z.x+z.w/2+1.2},${z.y+z.h-2}) rotate(-90)">${esc(z.ab||z.name)}</text>
           <text class="zone-sub" transform="translate(${z.x+z.w/2-2.4},${z.y+z.h-2}) rotate(-90)">${ld.n} · ${z.reach}s</text>`
        : z.h<11
        ? `<text class="zone-lbl" x="${z.x+1.8}" y="${z.y+z.h/2+1.3}">${esc(z.ab||z.name)}</text>
           <text class="zone-sub" x="${z.x+z.w-1.8}" y="${z.y+z.h/2+1.2}" text-anchor="end">${ld.n} · ${z.reach}s · ${Math.round(fill*100)}%</text>`
        : `<text class="zone-lbl" x="${z.x+1.8}" y="${z.y+5}">${esc(z.ab||z.name)}</text>
           <text class="zone-sub" x="${z.x+1.8}" y="${z.y+8.8}">${ld.n} item${ld.n===1?'':'s'} · ${z.reach}s · ${Math.round(fill*100)}% full</text>`}
    </g>`;
  }).join('');

  const sel=selZone?zone(selZone):null;
  const selBody=sel?zonePanel(sel,S):`
    <div class="panel-body"><div class="hint">Tap a zone on the plan to see what's in it.
      Everything below is placed with the dropdowns — the plan is the picture, the list is the truth.</div></div>`;

  const cmp=lastOpt?`<div class="panel"><div class="panel-head"><h3>Before / after</h3></div>
    <div class="panel-body"><div class="cmp">
      <div class="cmp-row"><span class="lab">Your layout</span><div class="track">
        <div class="fill" style="width:100%">${fmtMin(lastOpt.sec)} min</div></div></div>
      <div class="cmp-row"><span class="lab">Optimized</span><div class="track">
        <div class="fill best" style="width:${Math.max(6,(S.sec/lastOpt.sec)*100)}%">${fmtMin(S.sec)} min</div></div></div>
    </div><div class="hint" style="margin-top:8px">
      ${(lastOpt.min-S.min).toFixed(1)} min/day, ${((lastOpt.min-S.min)*5/60).toFixed(1)} hours a week per truck.
      Multiply by the number of trucks before you decide it's small.</div></div></div>`:'';

  return `<div class="split">
    <div>
      <div class="panel"><div class="panel-head"><h3>Truck, from above</h3>
        <span class="n">Tacoma Access Cab · 6' bed</span></div>
        <div class="panel-body">
          <svg class="plan" viewBox="0 0 82 216">
            <rect class="truck-body" x="3.8" y="22" width="74.4" height="190" rx="9"></rect>
            <rect class="truck-body" x="10" y="112" width="56.7" height="73.7" rx="2"
                  stroke-dasharray="2 1.6"></rect>
            <line x1="3.8" y1="46" x2="78.2" y2="46" stroke="var(--border)" stroke-width=".9"></line>
            <line x1="3.8" y1="112" x2="78.2" y2="112" stroke="var(--border)" stroke-width=".9"></line>
            <line x1="3.8" y1="185.7" x2="78.2" y2="185.7" stroke="var(--border)" stroke-width=".9"></line>
            <rect x="9.2" y="130.2" width="58.3" height="45.6" rx="1.4" fill="none"
                  stroke="var(--muted)" stroke-width="0.9"></rect>
            <text class="truck-note" x="10" y="1.6">not drawable in plan — the rack is overhead, the other is underneath</text>
            <text class="truck-note" x="4.5" y="44">hood</text>
            <text class="truck-note" x="4.5" y="110">cab · jump seats</text>
            <text class="truck-note" x="4.5" y="129">wooden box on the wheel wells</text>
            <text class="truck-note" x="4.5" y="184.4">bed · 73.7" × 56.7"</text>
            <text class="truck-note" x="4.5" y="192">tailgate</text>
            ${rects}
          </svg>
          <div class="hint" style="margin-top:8px">Drawn to scale in inches. Green is roomy, amber is nearly full, red is over
            capacity. Fuller zones cost extra seconds — things get buried.</div>
        </div></div>
      ${cmp}
    </div>
    <div>
      <div class="panel"><div class="panel-head">
          <h3>${sel?esc(sel.name):'Zone'}</h3>
          ${sel?`<span class="spacer"></span><button class="btn btn-sm" onclick="selZone=null;render()">clear</button>`:''}
        </div>${selBody}</div>

      <div class="panel"><div class="panel-head"><h3>Where everything lives</h3>
        <span class="n">${DB.tools.length} tools</span>
        <span class="spacer"></span>
        <button class="btn btn-sm" onclick="clearPlace()">empty the truck</button></div>
        <div class="panel-body flush">${placeRows(S)}</div></div>

      <div class="panel"><div class="panel-head"><h3>Biggest time sinks</h3>
        <span class="n">where the minutes actually go</span></div>
        <div class="panel-body flush">${S.per.slice(0,8).map(p=>{
          const z=p.zid?zone(p.zid):null;
          return `<div class="row"><span class="nm">${esc(p.tool.name)}</span>
            <span class="tag ${z?'zone':'hot'}">${z?esc(z.name):'no home'}</span>
            <span class="meta">${p.tool.trips}×/day · ${fmtMin(p.sec)} min</span></div>`;
        }).join('')}</div></div>
    </div></div>`;
}

function zonePanel(z,S){
  const ld=S.loads[z.id];
  const inside=DB.tools.filter(t=>DB.place[t.id]===z.id).sort((a,b)=>b.trips-a.trips);
  const vPct=Math.min(100,ld.vol/z.vol*100), wPct=Math.min(100,ld.lbs/z.lbs*100);
  const cls=p=>p>100?'bad':p>85?'warn':'';
  return `<div class="panel-body">
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)">
        <span><b style="color:var(--text)">${z.reach}s</b> base reach</span>
        <span><b style="color:var(--text)">${effReach(z,ld).toFixed(1)}s</b> as packed</span>
        <span><b style="color:var(--text)">${Math.round(z.rear*100)}%</b> on rear axle</span>
      </div>
      <div style="margin-top:9px">
        <div class="hint">Space ${ld.vol.toFixed(1)} / ${z.vol} cu ft</div>
        <div class="bar"><i class="${cls(ld.vol/z.vol*100)}" style="width:${vPct}%"></i></div>
        <div class="hint" style="margin-top:6px">Weight ${Math.round(ld.lbs)} / ${z.lbs} lbs</div>
        <div class="bar"><i class="${cls(ld.lbs/z.lbs*100)}" style="width:${wPct}%"></i></div>
      </div></div>
    <div class="panel-body flush" style="border-top:1px solid var(--border-soft)">
      ${inside.length?inside.map(t=>`<div class="row"><span class="nm">${esc(t.name)}</span>
          <span class="meta">${t.trips}×/day · ${t.lbs} lb</span>
          <button class="btn btn-sm" onclick="place('${t.id}','')">out</button></div>`).join('')
        :`<div class="row"><span class="hint">Empty.</span></div>`}
    </div>`;
}

function placeRows(S){
  const order=DB.tools.slice().sort((a,b)=>b.trips-a.trips);
  return order.map(t=>{
    const zid=DB.place[t.id]||'';
    const hot=t.trips>=8;
    return `<div class="row${selZone&&zid===selZone?' sel':''}">
      <span class="nm">${esc(t.name)}</span>
      ${t.long?'<span class="tag">4 ft+</span>':''}
      ${hot?'<span class="tag hot">grabbed a lot</span>':''}
      ${t.cat==='stock'?'<span class="tag">week stock</span>':''}
      <span class="meta">${t.trips}×/day</span>
      <select onchange="place('${t.id}',this.value)" style="max-width:168px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font:inherit;font-size:11.5px">
        <option value=""${zid?'':' selected'}>— no home —</option>
        ${DB.zones.map(z=>{
          const no=t.long&&!z.long;
          return `<option value="${z.id}"${zid===z.id?' selected':''}${no?' disabled':''}>${esc(z.name)}${no?" — too short":''}</option>`;
        }).join('')}
      </select></div>`;
  }).join('');
}
function place(tid,zid){
  if(zid)DB.place[tid]=zid; else delete DB.place[tid];
  save();
  setTimeout(render,0);
}
function clearPlace(){DB.place={};lastOpt=null;save();render();}

/* ── tools: the editable inventory ───────────────────────────────── */
function toolsView(S){
  const rows=DB.tools.slice().sort((a,b)=>b.trips-a.trips).map(t=>`<tr>
    <td><input value="${esc(t.name)}" onchange="editTool('${t.id}','name',this.value)"></td>
    <td><input value="${esc(t.cat||'')}" onchange="editTool('${t.id}','cat',this.value)" style="max-width:110px"></td>
    <td><input class="num" value="${t.trips}" onchange="editTool('${t.id}','trips',this.value)"></td>
    <td><input class="num" value="${t.vol}" onchange="editTool('${t.id}','vol',this.value)"></td>
    <td><input class="num" value="${t.lbs}" onchange="editTool('${t.id}','lbs',this.value)"></td>
    <td style="text-align:right"><button class="btn btn-sm btn-danger" onclick="delTool('${t.id}')">×</button></td>
  </tr>`).join('');
  return `<div class="panel"><div class="panel-head"><h3>Tools</h3>
      <span class="n">trips/day is the number that drives everything</span>
      <span class="spacer"></span><button class="btn btn-sm" onclick="addTool()">+ tool</button></div>
    <div class="panel-body flush"><table>
      <thead><tr><th>Tool</th><th>Category</th><th>Trips / day</th><th>cu ft</th><th>lbs</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="panel-body"><div class="hint">
      <b>Trips/day</b> is how many times somebody walks back to the truck for it across a whole day —
      count both crew. That is the only number the optimizer really cares about. Volume and weight
      just decide what fits where. All of it is a guess until you watch a couple of days; edit freely.
    </div></div></div>`;
}
function editTool(id,k,v){
  const t=tool(id);if(!t)return;
  t[k]=(k==='name'||k==='cat')?v:Math.max(0,num(v,0));
  save();
  setTimeout(render,0);   // let the field finish blurring before the DOM is replaced
}
function addTool(){
  DB.tools.push({id:uid(),name:'New tool',cat:'',vol:0.5,lbs:5,trips:1});
  save();render();
}
function delTool(id){
  DB.tools=DB.tools.filter(t=>t.id!==id);delete DB.place[id];save();render();
}

/* ── zones: the truck itself ─────────────────────────────────────── */
function zonesView(S){
  const rows=DB.zones.slice().sort((a,b)=>a.reach-b.reach).map(z=>{
    const ld=S.loads[z.id];
    return `<tr>
      <td><input value="${esc(z.name)}" onchange="editZone('${z.id}','name',this.value)"></td>
      <td><input class="num" value="${z.reach}" onchange="editZone('${z.id}','reach',this.value)"></td>
      <td><input class="num" value="${z.vol}" onchange="editZone('${z.id}','vol',this.value)"></td>
      <td><input class="num" value="${z.lbs}" onchange="editZone('${z.id}','lbs',this.value)"></td>
      <td><input class="num" value="${z.rear}" onchange="editZone('${z.id}','rear',this.value)"></td>
      <td><input class="num" value="${z.slots}" onchange="editZone('${z.id}','slots',this.value)"></td>
      <td class="meta" style="font-family:var(--mono);font-size:11px;white-space:nowrap">
        ${ld.n} · ${ld.vol.toFixed(1)} cf · ${Math.round(ld.lbs)} lb</td>
    </tr>`;
  }).join('');
  return `<div class="panel"><div class="panel-head"><h3>${esc(TRUCK.name)}</h3></div>
      <div class="panel-body"><div class="hint">
        Bed ${TRUCK.bedL}" long × ${TRUCK.bedW}" wide at the rails, ${TRUCK.bedWells}" between the wheel
        wells, ${TRUCK.bedD}" deep — about ${TRUCK.bedCuFt} cu ft. Payload around ${TRUCK.payload} lb
        depending on trim, and that is people, tools, stakes, water and fuel together.<br><br>
        <b>The box:</b> ${esc(TRUCK.box)}
      </div></div></div>
    <div class="panel"><div class="panel-head"><h3>Zones</h3>
      <span class="n">reach seconds is the whole model — measure it once with a stopwatch</span></div>
      <div class="panel-body flush"><table>
        <thead><tr><th>Zone</th><th>Reach (s)</th><th>cu ft</th><th>lbs max</th><th>Rear axle share</th><th>Slots</th><th>Holding</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="panel-body"><div class="hint">
        <b>Reach</b> = walk to it, open it, get the tool, be back at the work. Time it on a real truck and
        these numbers stop being guesses.<br>
        <b>Rear axle share</b> = how much of that zone's weight lands on the back tires. Behind the axle is
        over 1.0 because it levers weight off the front. Cab is low because it is ahead of the axle.<br>
        <b>Slots</b> = how many separate things can live there and still be found at a glance. A divided box
        has plenty; an open bed floor has about four, because past that it is a pile. Every item over the
        count adds ${RUMMAGE}s to everything in that zone — which is what stops the optimizer from
        answering \"put all of it on the tailgate\".
      </div></div></div>`;
}
function editZone(id,k,v){
  const z=zone(id);if(!z)return;
  z[k]=k==='name'?v:Math.max(0,num(v,0));
  save();
  setTimeout(render,0);
}

/* ── the layout sheet: the thing you tape inside the toolbox lid ── */
function sheetView(S){
  const zs=DB.zones.slice().sort((a,b)=>a.reach-b.reach);
  const body=zs.map(z=>{
    const inside=DB.tools.filter(t=>DB.place[t.id]===z.id).sort((a,b)=>b.trips-a.trips);
    const ld=S.loads[z.id];
    return `<div class="sheet-zone">
      <h4>${esc(z.name)} <span class="cap">${z.reach}s · ${ld.vol.toFixed(1)}/${z.vol} cu ft · ${Math.round(ld.lbs)}/${z.lbs} lb</span></h4>
      ${inside.length?`<ul>${inside.map(t=>`<li>${esc(t.name)}${t.trips>=8?' <b>(hot)</b>':''}</li>`).join('')}</ul>`
        :`<div class="hint" style="margin-top:4px">— empty —</div>`}</div>`;
  }).join('');
  const loose=DB.tools.filter(t=>!DB.place[t.id]);
  return `<div class="sheet">
    <h2>Truck layout — standard</h2>
    <div class="sub">${esc(TRUCK.name)} · every truck set up the same way ·
      ${fmtMin(S.sec)} min/day of fetching · ${Math.round(S.lbs)} lb of tools ·
      ${Math.round(S.rearPct*100)}% of it on the rear axle</div>
    ${body}
    ${loose.length?`<div class="sheet-zone"><h4 style="color:var(--red)">No home yet</h4>
      <ul>${loose.map(t=>`<li>${esc(t.name)}</li>`).join('')}</ul></div>`:''}
    <div class="hint" style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
      Print this and tape it inside the crossover lid. A layout only saves time if every truck matches it
      and a tool goes back where it came from.
    </div>
    <div style="margin-top:12px"><button class="btn" onclick="window.print()">print</button>
      <button class="btn" onclick="exportJson()">export JSON</button></div>
  </div>`;
}

async function exportJson(){
  const json=JSON.stringify(DB,null,2);
  const filename=`truck-layout-${new Date().toISOString().slice(0,10)}.json`;
  const host=window.claude;
  if(host&&typeof host.use==='function'){
    try{
      const d=await host.use('downloads');
      if(d){await d.save({filename,data:json});toast('exported');return;}
    }catch(e){toast(e?.code==='declined'?'export cancelled':'export failed');return;}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('exported');
}

load();render();
</script>
