function delPoint(id){
  const s=sub(ownerCtx.id);
  if(!confirm('Delete this control point?'))return;
  s.points=(s.points||[]).filter(p=>p.id!==id);
  save();closeModal();render();
}

/* ══════════════════ search ══════════════════
   One box over everything. Every word has to match, and matching also
   runs against a punctuation-stripped copy, so "5551234" finds
   "555-1234" and "tbm1" finds "TBM-1".
   ═══════════════════════════════════════════ */
function matches(hay,terms){
  const h=hay.toLowerCase(),hf=flat(hay);
  return terms.every(t=>h.includes(t)||hf.includes(flat(t)));
}
function searchView(){
  const terms=searchQ.toLowerCase().split(/\s+/).filter(Boolean);
  const groups=[
    {key:'subs',   title:'Subdivisions', ico:'🏘️', rows:[]},
    {key:'points', title:'Control',      ico:'📍', rows:[]},
    {key:'reqs',   title:'Requirements', ico:'⚠️', rows:[]},
    {key:'docs',   title:'Documents',    ico:'📄', rows:[]},
    {key:'jurs',   title:'Jurisdictions',ico:'🏛️', rows:[]},
    {key:'cities', title:'Cities',       ico:'🗺️', rows:[]}
  ];
  const G=Object.fromEntries(groups.map(g=>[g.key,g]));

  for(const r of DB.global.reqs)
    if(matches([r.title,r.detail,r.source,r.cat].join(' '),terms))
      G.reqs.rows.push({name:r.title,path:'Everywhere — applies to every job',go:'#/g'});
  for(const b of DB.builders){
    if(matches([b.name,b.notes].join(' '),terms))
      G.jurs.rows.push({name:b.name,path:`builder · ${b.reqs.length} rules`,go:`#/b/${b.id}`,ico:'🏗️'});
    for(const r of b.reqs)
      if(matches([r.title,r.detail,r.source,r.cat].join(' '),terms))
        G.reqs.rows.push({name:r.title,path:`${b.name} — every site they build`,go:`#/b/${b.id}`});
  }
  for(const c of DB.cities)
    for(const r of (c.reqs||[]))
      if(matches([r.title,r.detail,r.source,r.cat].join(' '),terms))
        G.reqs.rows.push({name:r.title,path:`${c.name} — whole county`,go:`#/c/${c.id}`});
  for(const c of DB.cities)
    if(matches([c.name,c.state,c.notes].join(' '),terms))
      G.cities.rows.push({name:c.name,path:`${jursIn(c.id).length} jurisdictions`,go:`#/c/${c.id}`});

  for(const j of DB.jurs){
    const c=city(j.cityId);
    const hay=[j.name,c?.name,j.notes,j.crs?.system,
               ...flagList(j.flags).map(f=>FLAG[f.k].l+' '+f.note)].join(' ');
    if(matches(hay,terms))G.jurs.rows.push({name:j.name,path:c?c.name:'—',go:`#/j/${j.id}`});
    for(const r of (j.reqs||[]))
      if(matches([r.title,r.detail,r.source,r.cat].join(' '),terms))
        G.reqs.rows.push({name:r.title,path:`${j.name} — applies to all subs`,go:`#/j/${j.id}`});
    for(const d of (j.docs||[]))
      if(matches([d.title,d.url].join(' '),terms))
        G.docs.rows.push({name:d.title,path:j.name,go:`#/j/${j.id}`,url:d.url,ico:(DOC_KIND[d.kind]||DOC_KIND.other).i});
  }

  for(const s of DB.subs){
    const hay=[s.name,(s.aliases||[]).join(' '),s.gate,s.contactName,s.contactPhone,
               buildersOf(s).map(b=>b.name).join(' '),(s.workTypes||[]).join(' '),s.munCandidate,
               s.access,s.benchmark,s.notes,pathOf(s),
               ...flagList(s.flags).map(f=>FLAG[f.k].l+' '+f.note)].join(' ');
    if(matches(hay,terms))
      G.subs.rows.push({name:s.name,path:pathOf(s)+(s.gate?` · gate ${s.gate}`:''),go:`#/s/${s.id}`});
    for(const p of (s.points||[]))
      if(matches([p.name,p.desig,p.desc,p.elev,p.elevDatum,p.setBy,p.mon].join(' '),terms))
        G.points.rows.push({name:`${p.type} ${p.name}`,path:`${s.name} · ${p.elev?p.elev+' ':''}${p.desc||''}`.trim(),
                            go:`#/s/${s.id}`,focus:p.id,ico:p.type==='TBM'?'🔶':'📍'});
    for(const r of (s.reqs||[]))
      if(matches([r.title,r.detail].join(' '),terms))
        G.reqs.rows.push({name:r.title,path:s.name,go:`#/s/${s.id}`});
    for(const d of (s.docs||[]))
      if(matches([d.title,d.url].join(' '),terms))
        G.docs.rows.push({name:d.title,path:s.name,go:`#/s/${s.id}`,url:d.url,ico:(DOC_KIND[d.kind]||DOC_KIND.other).i});
  }

  const total=groups.reduce((n,g)=>n+g.rows.length,0);
  if(!total)return `<div class="empty-hint">Nothing matches “${esc(searchQ)}”.</div>`;
  const html=groups.filter(g=>g.rows.length).map(g=>`<div class="res-group">
      <h4>${g.title} · ${g.rows.length}</h4>
      ${g.rows.slice(0,40).map(r=>`<div class="res" onclick="jump('${r.go}'${r.focus?`,'${r.focus}'`:''})">
          <span class="res-ico">${r.ico||g.ico}</span>
          <span class="res-main"><span class="res-name">${mark(r.name,terms)}</span>
            <span class="res-path">${mark(r.path||'',terms)}</span></span>
          ${r.url?`<a class="btn btn-sm" data-stop href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">open ↗</a>`:''}
        </div>`).join('')}
      ${g.rows.length>40?`<div class="hint">+${g.rows.length-40} more — narrow the search</div>`:''}
    </div>`).join('');
  return `<div class="view-head"><div><div class="view-title">${total} match${total===1?'':'es'}</div>
    <div class="view-sub">for “${esc(searchQ)}” · Esc clears</div></div></div>${html}`;
}
function mark(text,terms){
  let out=esc(text);
  for(const t of terms){
    if(t.length<2)continue;
    out=out.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig'),'<mark>$1</mark>');
  }
  return out;
}
let pendingFocus=null;
function jump(hash,focusId){
  pendingFocus=focusId||null;
  el('search').value='';searchQ='';
  go(hash);
  if(pendingFocus)setTimeout(()=>{focusPoint(pendingFocus);pendingFocus=null;},420);
}

/* ══════════════════ import / export ══════════════════ */
function openDataModal(){
  const pts=allPoints().length;
  openModal(`<h2>Library data</h2>
    <div class="sub-meta">Everything lives in this browser. Export to move it to another machine or to back it up.</div>
    <div class="panel" style="box-shadow:none;margin:10px 0">
      <div class="panel-body"><div class="crs-grid">
        <div class="crs-cell"><div class="lbl">Cities</div><div class="val">${DB.cities.length}</div></div>
        <div class="crs-cell"><div class="lbl">Jurisdictions</div><div class="val">${DB.jurs.length}</div></div>
        <div class="crs-cell"><div class="lbl">Subdivisions</div><div class="val">${DB.subs.length}</div></div>
        <div class="crs-cell"><div class="lbl">Control points</div><div class="val">${pts}</div></div>
      </div></div>
    </div>
    <button class="btn btn-primary" onclick="exportJson()">⬇ export JSON</button>
    <button class="btn" onclick="el('importFile').click()">⬆ import JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importJson(this)">
    <div class="hint">Import <b>merges</b> — cities, jurisdictions and subs with the same name are updated in place, new ones are added. Nothing is deleted.</div>
    <div class="subhead">Danger</div>

    ${DB.cities.length?'':`<button class="btn" onclick="seedLibrary();save();render()">restore the seeded library</button>`}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">close</button></div>`);
}
async function exportJson(){
  const json=JSON.stringify(DB,null,2);
  const filename=`sub-intel-${new Date().toISOString().slice(0,10)}.json`;
  // A page running inside the claude.ai viewer can't download on its own —
  // it asks the host to hand the viewer the file. Opened from a drive or a
  // web server, window.claude doesn't exist and it's a plain blob link.
  const host=window.claude;
  if(host&&typeof host.use==='function'){
    try{
      const downloads=await host.use('downloads');
      if(downloads){
        await downloads.save({filename,data:json});
        toast('exported');
        return;
      }
    }catch(e){
      toast(e?.code==='declined'?'export cancelled':'export failed',e?.code!=='declined');
      return;
    }
  }
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('exported');
}
function importJson(input){
  const f=input.files?.[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=migrate(JSON.parse(r.result));
      if(!d||!Array.isArray(d.subs))throw new Error('not a Sub Intel export');
      mergeIn(d);
      save();closeModal();render();
      toast('imported');
    }catch(e){console.error(e);toast('could not read that file',1);}
  };
  r.readAsText(f);
  input.value='';
}
/* merge by name so two people can keep parallel copies and combine them */
/* Keep an incoming id when nothing here is using it. Minting a new one every
   time is what broke the seed: its records carry stable ids, and an
   export/import round trip was throwing them away, so the next seed update
   could not match them and added all 104 a second time. */
const keepId=(id,taken)=>(id&&!taken.has(id))?id:uid();

function mergeIn(d){
  if(d.seedV!==undefined)DB.seedV=d.seedV;
  if(d.seededAt)DB.seededAt=d.seededAt;
  // the two scopes that are not places
  DB.global||={reqs:[],docs:[]};
  if(d.global){
    DB.global.reqs=mergeList(DB.global.reqs,d.global.reqs,'title');
    DB.global.docs=mergeList(DB.global.docs,d.global.docs,'title');
  }
  const builderIdMap={};
  for(const b of (d.builders||[])){
    let ex=DB.builders.find(x=>normKey(x.name)===normKey(b.name));
    if(ex){
      ex.reqs=mergeList(ex.reqs,b.reqs,'title');
      ex.docs=mergeList(ex.docs||[],b.docs,'title');
      ex.notes=ex.notes||b.notes;
    }else{ex={...b,id:keepId(b.id,new Set(DB.builders.map(x=>x.id))),reqs:b.reqs||[],docs:b.docs||[]};DB.builders.push(ex);}
    builderIdMap[b.id]=ex.id;
  }

  const cityBy=n=>DB.cities.find(c=>normKey(c.name)===normKey(n));
  for(const c of (d.cities||[])){
    const ex=cityBy(c.name);
    if(ex){
      Object.assign(ex,{state:c.state||ex.state,notes:c.notes||ex.notes});
      ex.reqs=mergeList(ex.reqs||[],c.reqs,'title');
      ex.docs=mergeList(ex.docs||[],c.docs,'title');
    }
    else DB.cities.push({...c,id:c.id||uid(),reqs:c.reqs||[],docs:c.docs||[]});
  }
  const cityIdMap={};
  for(const c of (d.cities||[]))cityIdMap[c.id]=cityBy(c.name)?.id;
  const jurIdMap={};
  for(const j of (d.jurs||[])){
    const cid=cityIdMap[j.cityId]||DB.cities[0]?.id;
    const ex=DB.jurs.find(x=>normKey(x.name)===normKey(j.name)&&x.cityId===cid);
    if(ex){
      jurIdMap[j.id]=ex.id;
      ex.crs={...ex.crs,...j.crs};
      ex.flags={...ex.flags,...normFlags(j.flags)};
      ex.reqs=mergeList(ex.reqs,j.reqs,'title');
      ex.docs=mergeList(ex.docs,j.docs,'title');
      ex.notes=ex.notes||j.notes;
    }else{
      const nj={...j,id:keepId(j.id,new Set(DB.jurs.map(x=>x.id))),cityId:cid};
      DB.jurs.push(nj);jurIdMap[j.id]=nj.id;
    }
  }
  for(const s of (d.subs||[])){
    const jid=jurIdMap[s.jurId]||DB.jurs[0]?.id;
    const ex=DB.subs.find(x=>normKey(x.name)===normKey(s.name)&&x.jurId===jid);
    if(ex){
      for(const k of ['gate','contactName','contactPhone','access','benchmark','notes'])
        if(s[k])ex[k]=s[k];
      if(s.lat!=null){ex.lat=s.lat;ex.lon=s.lon;}
      ex.crs={...ex.crs,...s.crs};
      ex.flags={...ex.flags,...normFlags(s.flags)};
      ex.builderIds=[...new Set([...(ex.builderIds||[]),
        ...(s.builderIds||[]).map(b=>builderIdMap[b]||b)])];
      for(const k of ['aliases','workTypes','lastJob','active','munCandidate'])
        if(s[k]!==undefined&&ex[k]===undefined)ex[k]=s[k];
      ex.reqs=mergeList(ex.reqs,s.reqs,'title');
      ex.docs=mergeList(ex.docs,s.docs,'title');
      ex.points=mergeList(ex.points,s.points,'name');
    }else DB.subs.push({...s,id:keepId(s.id,new Set(DB.subs.map(x=>x.id))),jurId:jid,
      builderIds:(s.builderIds||[]).map(b=>builderIdMap[b]||b)});
  }
}
function mergeList(a,b,key){
  const out=(a||[]).slice();
  for(const item of (b||[])){
    const ex=out.find(x=>normKey(x[key])===normKey(item[key]));
    if(ex)Object.assign(ex,{...item,id:ex.id});
    else out.push({...item,id:keepId(item.id,new Set(out.map(x=>x.id)))});
  }
  return out;
}
function wipe(){
  if(!confirm('Erase every city, jurisdiction, subdivision and control point on this machine? Export first if you want it back.'))return;
  if(!confirm('Really erase it all? There is no undo.'))return;
  DB={version:4,global:{reqs:[],docs:[]},builders:[],cities:[],jurs:[],subs:[]};
  route={v:'home'};
  save();closeModal();go('#/');render();
}

/* ══════════════════ chrome wiring ══════════════════ */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const next=cur?(cur==='dark'?'light':'dark'):(dark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
}
try{
  const t=localStorage.getItem(THEME_KEY);
  if(t)document.documentElement.setAttribute('data-theme',t);
}catch(e){}

el('search').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(el('overlay').classList.contains('open'))return closeModal();
    if(mapState.pickMode){mapState.pickMode=null;document.querySelectorAll('.map-hint').forEach(n=>n.remove());return;}
    if(searchQ){el('search').value='';searchQ='';render();}
    return;
  }
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='SELECT'){
    e.preventDefault();el('search').focus();
  }
});

/* ══════════════════ installable web app ══════════════════
   Hosted, it installs to a phone's home screen and opens without browser
   chrome. The service worker caches the app shell only — never map tiles,
   which would cost tens of megabytes on the phone. So the library works
   with no signal and the map doesn't.
   ══════════════════════════════════════════════════════ */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  installPrompt=e;
  el('installBtn').hidden=false;
});
async function installApp(){
  if(!installPrompt)return;
  el('installBtn').hidden=true;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt=null;
}
window.addEventListener('appinstalled',()=>{
  installPrompt=null;
  el('installBtn').hidden=true;
  toast('installed — it is on the home screen now');
});

function netState(){el('offlinePill').hidden=navigator.onLine;}
window.addEventListener('online',()=>{netState();toast('back online');});
window.addEventListener('offline',()=>{netState();toast('offline — the library still works, the map needs signal');});
netState();

if('serviceWorker' in navigator&&window.isSecureContext){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;
        if(!w)return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed'&&navigator.serviceWorker.controller)toast('new version ready — reload to get it');
        });
      });
    }).catch(()=>{});  // file://, an iframe, a blocked registration — the app is fine without it
  });
}

load();
readRoute();
if(seedAction==='updated')toast('library updated to the latest survey');
